[package]
name = "gogolf-cli"
description = "CLI tool for interacting with the gogolf API"
license = "MIT"
version = "0.0.1-rc-charlie"
edition = "2024"
include = [
    "src"
]

[dependencies]
reqwest = "0.12.24"
rpassword = "7.4.0"
rustyline = "5.0.1"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
